services:
  app:
    image: jheidt04/am-i-drunk:latest
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - PORT=5000
    networks:
      - drunk-net
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role != manager
      restart_policy:
        condition: on-failure
        delay: 5s
      update_config:
        order: start-first
        parallelism: 1
      resources:
        limits:
          memory: 512M
          cpus: "0.50"
        reservations:
          memory: 256M

networks:
  drunk-net:
    driver: overlay
    attachable: true
