services:
  app:
    image: ghcr.io/julian-heidt/are-you-drunk:latest
    environment:
      - PORT=5000
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://alloy-apps:4318
      - OTEL_SERVICE_NAME=are-you-drunk
      - PROMETHEUS_MULTIPROC_DIR=/tmp/prometheus_multiproc
    networks:
      proxy-net:
      monitoring:
        aliases:
          - are-you-drunk
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role != manager
      restart_policy:
        condition: on-failure
        delay: 5s
      update_config:
        order: start-first
        parallelism: 1
        failure_action: rollback
        monitor: 180s
      rollback_config:
        order: start-first
        parallelism: 1
        monitor: 60s
      resources:
        limits:
          memory: 512M
          cpus: "0.50"
        reservations:
          memory: 256M

networks:
  proxy-net:
    external: true
  monitoring:
    external: true
