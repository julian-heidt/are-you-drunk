<!DOCTYPE html>
<html lang="en" data-theme="blueprint" data-mode="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Are You Drunk?</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="site-header" role="banner">
    <div class="header-inner">
      <span class="site-title">Are You Drunk?</span>
      <div class="header-controls" role="group" aria-label="Theme controls">
        <div class="theme-toggle" role="radiogroup" aria-label="Color theme">
          <button class="theme-btn active" data-theme="blueprint" role="radio" aria-checked="true" aria-label="Blueprint theme">B</button>
          <button class="theme-btn" data-theme="forest" role="radio" aria-checked="false" aria-label="Forest theme">F</button>
        </div>
        <button class="mode-btn" id="mode-toggle">&#x2600;&#xFE0F;</button>
      </div>
    </div>
  </header>

  <main class="main-content" id="main">
    <div class="gauge-container">
      <form id="bac-form" novalidate aria-label="BAC calculator">

        <!-- Weight field -->
        <div class="gauge-field">
          <div class="gauge-field-header">
            <label class="gauge-label" for="weight">Body Weight</label>
            <div class="weight-unit-toggle" role="radiogroup" aria-label="Weight unit">
              <button type="button" class="unit-btn active" data-unit="lbs" aria-checked="true">lbs</button>
              <button type="button" class="unit-btn" data-unit="kg" aria-checked="false">kg</button>
            </div>
          </div>
          <div class="gauge-number-wrap">
            <input type="number" id="weight" name="weight" class="gauge-number-input"
              min="50" max="500" value="185" required aria-required="true">
            <span class="gauge-unit" id="weight-unit-display" aria-live="polite">lbs</span>
          </div>
          <div class="gauge-track" role="presentation">
            <div class="gauge-track-fill" id="weight-track" style="width: 38%"></div>
          </div>
        </div>

        <!-- Age field -->
        <div class="gauge-field">
          <label class="gauge-label" for="age">Age</label>
          <div class="gauge-number-wrap">
            <input type="number" id="age" name="age" class="gauge-number-input"
              min="18" max="99" value="25" required aria-required="true">
            <span class="gauge-unit">yrs</span>
          </div>
          <div class="gauge-track" role="presentation">
            <div class="gauge-track-fill" id="age-track" style="width: 20%"></div>
          </div>
        </div>

        <!-- Sex field -->
        <div class="gauge-field">
          <fieldset>
            <legend class="gauge-label">Biological Sex</legend>
            <div class="sex-pills">
              <label class="sex-pill">
                <input type="radio" name="gender" value="male" checked>
                <span>Male</span>
              </label>
              <label class="sex-pill">
                <input type="radio" name="gender" value="female">
                <span>Female</span>
              </label>
              <label class="sex-pill">
                <input type="radio" name="gender" value="other">
                <span>Other</span>
              </label>
            </div>
          </fieldset>
        </div>

        <!-- Drinks field -->
        <div class="gauge-field">
          <label class="gauge-label" for="current-drinks">Drinks Consumed</label>
          <div class="gauge-number-wrap">
            <input type="number" id="current-drinks" name="current_drinks" class="gauge-number-input"
              min="0" max="30" value="0" required aria-required="true">
            <span class="gauge-unit">drinks</span>
          </div>
          <div class="gauge-track" role="presentation">
            <div class="gauge-track-fill" id="drinks-track" style="width: 0%"></div>
          </div>
        </div>

        <button type="submit" class="calculate-btn">
          Calculate &rarr;
        </button>
      </form>

      <!-- Result panel (hidden until calculation) -->
      <div id="result" class="result-panel" hidden aria-live="polite" aria-atomic="true">
        <div class="result-inner">
          <p id="drinks-to-target" class="result-primary"></p>
          <p id="time-to-sober" class="result-secondary"></p>
        </div>
        <p class="disclaimer">Not responsible for your decisions. Don't drive.</p>
      </div>
    </div>
  </main>

  <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
